         src/analytics/consent.ts once the visitor has agreed. -->

    <link rel="icon" type="image/png" href="/logo-animos-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="animos — ready-made animation templates for showcasing your designs. Drop in images or videos, tweak, and export MP4/WebM in your browser." />

    <!-- Social sharing (Open Graph + Twitter). Absolute URLs so scrapers resolve them. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="animos" />
    <meta property="og:url" content="https://animos.app/" />
    <meta property="og:title" content="animos — Motion templates for design showcases" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Load fonts without blocking first paint: fetch as a preload, then flip
         to a stylesheet once it arrives (display=swap renders text immediately
         with a fallback font). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />

        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
