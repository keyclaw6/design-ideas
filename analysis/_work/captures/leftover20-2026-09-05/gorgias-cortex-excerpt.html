    const base = isDebug

        return new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = reject;
            parent.appendChild(s);
        });

                load(`${base}/src/js/cookies${min}.js`, body),
                load('//js.hsforms.net/forms/embed/v2.js', body)
                    .then(() => hubqueue.forEach(c => window.hbspt.forms.create(c))),
            ]);
        });
})();
