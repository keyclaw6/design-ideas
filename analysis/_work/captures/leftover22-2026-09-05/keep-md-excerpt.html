e="# Set up Keep for this project

Set up Keep completely for this project. Keep is the shared context library for the user and their AI agents. Do the work yourself where you can. Pause only when the user must create an account, enter a secret, sign in, approve access, or restart the AI client.

## Install and authenticate the CLI

1. Run `npm i -g keep`, then `keep --version`.
2. Run `keep auth status`.
3. If it reports that no client is connected:
   - If the user does not have an account, ask them to sign up at https://app.keep.md/signup and wait for them to finish.
   - Match the current AI client to one exact command below. Use the lowercase name shown. Do not change its spelling or add spaces.
     - Claude Code: `keep login claude-code`
     - Claude Desktop: `keep login claude-desktop`
     - Cursor: `keep login cursor`
     - Codex: `keep login codex`
     - ChatGPT: `keep login chatgpt`
     - OpenCode: `keep login opencode`
     - Pi: `keep login pi`
   - Run the matching command yourself. Do not ask the user to choose the client name or run the command.
   - The command shows a short code and opens Keep in the browser. Ask the user only to sign in if needed, check that the code matches, and approve access. Never ask them to paste a token into the conversation, and never print, log, or save one.
4. Run `keep auth status` again, then `keep whoami`. Do not continue until both commands confirm the intended named client and Keep account.
5. Run `keep skill install` for the current agent if it is supported, then confirm it with `keep skill status`.

## Connect the MCP server

1. Use the same current client you matched above. Claude Code and Claude Desktop are separate clients. Follow that client's current instructions at https://keep.md/docs/mcp to add the remote Keep MCP server at https://keep.md/mcp to this project. Do not invent a config format or use a different endpoint.
2. Start the MCP connection. It should open Keep in the browser. If the user does not have an account, let them create one, then ask them to sign in and approve the requested access.
3. If the client must restart before it can load a new MCP server, tell the user exactly what must restart and continue this setup after the restart.
4. Call the MCP `whoami` tool. Do not claim MCP is connected until it returns the intended Keep account.

## Verify the setup with real context

1. Search Keep for context relevant to this project with `keep search` and the MCP `search_context` tool. Open only results that can affect the current work.
2. Do not create a note just to prove setup. A new user's first note should contain context they actually want to keep.
3. Search saved items for https://keep.md/docs/skill before saving it. Reuse the existing item if present. Otherwise save that exact URL with the MCP `save_item` tool. This gives the user a relevant guide and verifies the onboarding capture flow.
4. Search for that item again with `keep items search` and the MCP `search_items` tool, then open it with `keep get` and the MCP `get_item` tool. Both connections must return the same saved item.
5. Give the user a short checklist of what succeeded. Include the item link. If the item tool only returns an ID, use `https://app.keep.md/feed/<item-id>`.
