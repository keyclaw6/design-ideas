<style>
  /* ════════════════════════════════════════════════════════════════════
     MARKETING THEME (MapsData): a token set PARALLEL to _theme_head.html,
     kept because the marketing pages are hand-styled (no Tailwind) and
     every inline style here speaks --ink/--line/--surface, not the app's
     shadcn names. Values are the same mint palette as the app; the
     vocabulary differs. Change --accent once to rebrand.

     Mint is a FILL, never text: --on-accent (#04140c) is the near-black ink
     that sits on it, and --accent-ink is mint-as-text (darkened in light
     mode so it stays legible). Do not paint text with --accent.
     ════════════════════════════════════════════════════════════════════ */
  :root {
    /* Mint holds across both themes; only the surfaces invert. */
    --accent: #51f0a8;
    --on-accent: #04140c;

    /* Light (default :root values; dark overrides below) */
    --bg:#fdfdfd; --surface:#ffffff; --surface-2:#f6f7f8; --surface-3:#eef0f1;
    --ink:#0a0a0a; --ink-2:#525252; --ink-3:#9a9a9a; --ink-4:#b0b0b0; --ink-nav:#3a3a3a;
    --line:#ececee; --line-2:#eff0f1; --line-3:#f2f3f4; --line-4:#f5f6f7;
    --input-border:#e0e2e6; --map-bg:#f6f7f8; --map-dot:#e0e2e6; --map-pin:#b0b0b0;
    --invert-bg:#0a0a0a; --invert-bg-2:#141416; --invert-ink:#f0f0f0; --invert-ink-2:#969696;
    --invert-line:#1d1d1f; --invert-input-line:#333338;
    --accent-soft: #e4fef3;
    --accent-ink: #0d9f5d;
    --accent-hl: color-mix(in oklab, var(--accent) 42%, #ffffff);
    --accent-glow: color-mix(in oklab, var(--accent) 30%, transparent);
    /* Type roles, matching _theme_head.html */
    --serif: 'Lora', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The MapsData mark ships black on transparent, so it must be inverted on
       dark surfaces or it disappears into them. Same token name as
       _theme_head.html so the logo markup is copy-pasteable between the app
       and the marketing pages. */
    --logo-filter: none;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg:#000000; --surface:#0a0a0a; --surface-2:#141416; --surface-3:#1d1d20;
    --ink:#f0f0f0; --ink-2:#969696; --ink-3:#6a6a6a; --ink-4:#5a5a5a; --ink-nav:#c8c8c8;
    --line:#1d1d1f; --line-2:#1a1a1c; --line-3:#181819; --line-4:#161617;
    --input-border:#333338; --map-bg:#141416; --map-dot:#252527; --map-pin:#3a3a3e;
    --invert-bg:#000000; --invert-bg-2:#141416; --invert-ink:#f0f0f0; --invert-ink-2:#969696;
    --invert-line:#1d1d1f; --invert-input-line:#333338;
    --accent-soft: #08301f;
    --accent-ink: #51f0a8;
    --accent-hl: color-mix(in oklab, var(--accent) 50%, #141416);
    --accent-glow: color-mix(in oklab, var(--accent) 34%, transparent);
    --logo-filter: invert(1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  /* background-color on <html> (not only body) survives SCREEN RECORDING:
     Chromium's tab/display-capture path (Loom) reverts the body-propagated
     viewport canvas to the light UA default under color-scheme:dark, flipping
     dark pages light in the recording. An explicit html background is a
     concrete themed color the capture path keeps. See _theme_head.html. */
  html { background-color: var(--bg); }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg); color: var(--ink);
    transition: background .2s ease, color .2s ease;
  }
  ::selection { background: color-mix(in oklab, var(--accent) 38%, #ffffff); color: #0a0a0a; }
  a { text-decoration: none; color: inherit; }
  input { font-family: inherit; }
  @keyframes hv-spin { to { transform: rotate(360deg); } }
  @keyframes hv-pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes hv-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  /* ── Reusable component classes (translated from the prototype's
        style-hover / style-focus pseudo-attributes into real CSS) ── */
  .hvm-navlink { color: var(--ink-nav); transition: color .15s ease; }
  .hvm-navlink:hover { color: var(--ink); }

  .hvm-link { transition: color .15s ease; }
  .hvm-link:hover { color: var(--ink); }

  .hvm-btn-accent {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 700; color: var(--on-accent); background: var(--accent);
    border: none; cursor: pointer;
    box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--accent) 78%, #000);
    transition: filter .15s ease;
  }
  .hvm-btn-accent:hover { filter: brightness(1.05); }

  .hvm-btn-soft {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-weight: 600; color: var(--ink); background: transparent;
    border: 1px solid var(--input-border); cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .hvm-btn-soft:hover { border-color: var(--accent); color: var(--accent-ink); }

  .hvm-input {
    width: 100%; height: 54px; padding: 0 18px; font-size: 16px;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--input-border); border-radius: 13px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .hvm-input::placeholder { color: var(--ink-3); }
  .hvm-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 22%, transparent);
  }
  .hvm-input--invert { color: var(--invert-ink); background: var(--invert-bg-2); border-color: var(--invert-input-line); }
  .hvm-input--invert:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 26%, transparent); }

  .hvm-feature-card { transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease; }
  .hvm-feature-card:hover {
    border-color: color-mix(in oklab, var(--accent) 35%, var(--line));
    transform: translateY(-2px);
  }

  /* ── Responsive (≤760px), mirroring the reference breakpoint ── */
  @media (max-width: 760px) {
    .hv-nav { padding-left: 16px !important; padding-right: 16px !important; gap: 12px !important; }
    .hv-navlinks { display: none !important; }
    .hv-hero { padding: 40px 20px 0 !important; }
    .hv-section { padding-left: 20px !important; padding-right: 20px !important; }
    .hv-h1, .hv-sub, .hv-narrow, .hv-cta-h2 { max-width: none !important; }
    .hv-proof { grid-template-columns: repeat(2, 1fr) !important; }
    .hv-visual { transform: none !important; }
    .hv-chrome-url { display: none !important; }
    .hv-panel-left, .hv-panel-right { min-width: 0 !important; flex-basis: 100% !important; }
    .hv-panel-left { border-right: none !important; border-bottom: 1px solid var(--line-2) !important; }
    .hv-table-row { grid-template-columns: 1.5fr 1.8fr 76px !important; }
    .hv-table-row > :nth-child(3) { display: none !important; }
    .hv-form { flex-direction: column !important; align-items: stretch !important; }
    .hv-form-btn { width: 100% !important; }
    /* The email inputs carry `flex: 1 1 260px` for the DESKTOP row, where 260px
       is a width basis. Once .hv-form flips to a column the main axis is
       vertical, so that 260px becomes a HEIGHT basis and overrides the input's
       own height:54px, ballooning it to a 260px-tall box. Reset to flex:none so
       the explicit 54px height applies again, full-width. */
    .hv-form .hvm-input,
    .hv-form .hvm-input--invert,
    .hv-form .hv-cta-input {
      flex: none !important; width: 100% !important; height: 52px !important;
    }
    .hv-pricing-grid { grid-template-columns: 1fr !important; }
    /* Stacked cards: the featured tier's desktop -12px lift would carve an
       uneven gap into the column, so ground it. */
    .hv-pricing-grid .hv-pop { transform: none !important; }
  }
  
  /* Closing CTA sits on the mint panel, so its controls can't use the themed
     --surface/--accent pairs: on mint, a mint focus ring is invisible. They get
     a fixed near-black/white pair that works because the panel is mint in both
     themes. */
  .hv-cta-input::placeholder { color: #9a9a9a; }
  .hv-cta-input:focus { box-shadow: 0 0 0 4px color-mix(in oklab, #0a0a0a 22%, transparent); }
  .hv-cta-btn:hover { filter: brightness(1.35); }
  .hv-cta-btn:active { transform: translateY(0.5px); }
  .hv-cta-btn:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 3px; }

  /* Globe still: one render per theme (globe.js bakes its palette in). */
  [data-theme="dark"] .hv-globe--light { display: none !important; }
  [data-theme="dark"] .hv-globe--dark { display: block !important; }

  /* Masked contact data in the demo table. The point of the table is to prove
     the rows are real and specific while holding back the field people are
     actually paying for, which is the same tease the ungated hero search uses.
     Showing the first character and the domain keeps the shape of a real
     address readable; blurring the middle is what makes it a sample.
     user-select stops the blur being defeated by select-and-copy. */
  .hv-mask { filter: blur(4.5px); user-select: none; -webkit-user-select: none; }

  /* Feature grid + steps + FAQ (Phase 2 content sections) */
  .hv-featgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .hv-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .hv-faq details { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .hv-faq details + details { margin-top: 10px; }
  .hv-faq summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 16px 20px; font-weight: 700; font-size: 15.5px;
  }
  .hv-faq summary::-webkit-details-marker { display: none; }
  .hv-faq summary::after { content: "+"; font-size: 20px; font-weight: 500; color: var(--ink-3); flex: none; }
  .hv-faq details[open] summary::after { content: "\2212"; }
  .hv-faq .hv-faq-a { padding: 0 20px 18px; font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
  @media (max-width: 760px) {
    .hv-featgrid, .hv-steps { grid-template-columns: 1fr; }
  }

</style>
</head>
