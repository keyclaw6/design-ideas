y real design engineers. Preview live, install with one command — for you and your AI agent.","potentialAction":{"@type":"SearchAction","target":{"@type":"EntryPoint","urlTemplate":"https://21st.dev/community/components?q={search_term_string}"},"query-input":"required name=search_term_string"}}</script><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is 21st?","acceptedAnswer":{"@type":"Answer","text":"21st is a community catalog of UI built by design engineers: React components, full templates, shadcn themes, shaders, and gradients. You browse them, preview them live, and copy an AI-ready prompt that drops any component into your project through Cursor, Claude Code, v0, Lovable, or any other AI agent."}},{"@type":"Question","name":"Is 21st free?","acceptedAnswer":{"@type":"Answer","text":"Yes. Browsing the whole registry is free, and you get 2 free component copies every day. Membership unlocks unlimited copies and premium templates from their authors. 21st AI, for generating and refining UI, is an add-on you turn on with a monthly credit allowance."}},{"@type":"Question","name":"How is this different from a React component library?","acceptedAnswer":{"@type":"Answer","text":"A component library is one package with one aesthetic, installed as a dependency. 21st is a registry: many authors, many styles, and the code is copied into your repo rather than imported. You own it and can change it — there is no version of us to upgrade."}},{"@type":"Question","name":"How do I install a component?","acceptedAnswer":{"@type":"Answer","text":"Hit Copy prompt on any component and paste it into your AI tool — Cursor, Claude Code, v0, Lovable — and the agent rebuilds it inside your codebase, wired to your stack. That's how most people ship components from 21st. Prefer the classic way? Every component also comes with a shadcn CLI install command."}},{"@type":"Question","name":"Do components work with shadcn/ui?","acceptedAnswer":{"@type":"Answer","text":"Yes. Components are published in the shadcn registry format and are built to compose with shadcn/ui primitives and your existing design tokens."}},{"@type":"Question","name":"Can I publish my own components?","acceptedAnswer":{"@type":"Answer","text":"Yes. Anyone can publish to the registry. You keep authorship, your components live on your public profile, and template authors can sell their work directly."}},{"@type":"Question","name":"What are React templates on 21st?","acceptedAnswer":{"@type":"Answer","text":"Templates are complete, production-ready starting points — full pages and multi-page apps rather than single components. They are built by the same community of authors, and each one lists exactly what it includes before you buy."}}]}</script><div class="dark min-h-screen overflow-x-clip bg-background text-foreground" style="--lp-accent:var(--primary)"><script>(function(){try{if('scrollRestoration' in history){history.scrollRestoration='manual'}window.scrollTo(0,0);addEventListener('load',function(){window.scrollTo(0,0)},{once:true})}catch(e){}})()</script><style>
